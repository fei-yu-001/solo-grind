<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#909399"/></marker></defs>
<rect width="1500" height="840" fill="#fafafa"/>
<text x="50" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#303133">系统分层架构（上层只依赖下一层，禁止跨层调用）</text>
<rect x="50" y="80" width="1400" height="120" rx="12" fill="#e6f4ff" stroke="#1677ff" stroke-width="2"/><text x="80" y="124" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#1677ff">表现层 Vue 3 + Element Plus（5173）</text><text x="80" y="162" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#303133">登录 / 概览 / 题库 / 题目 / 试卷 / 成绩 六个页面，axios 统一带 token</text>
<rect x="50" y="230" width="1400" height="120" rx="12" fill="#f6ffed" stroke="#389e0d" stroke-width="2"/><text x="80" y="274" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#389e0d">控制层 Controller（8080）</text><text x="80" y="312" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#303133">AuthController / BankController / QuestionController / PaperController / AnswerController / ScoreController / TagController，只收参数、包 Result，不写业务</text>
<rect x="50" y="380" width="1400" height="120" rx="12" fill="#fff7e6" stroke="#d46b08" stroke-width="2"/><text x="80" y="424" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#d46b08">业务层 Service</text><text x="80" y="462" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#303133">事务（组卷 / 交卷 / 批量移动）、业务校验（状态流转 / 引用校验 / 权限）、VO 组装、缓存读写、判分逻辑</text>
<rect x="50" y="530" width="1400" height="120" rx="12" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/><text x="80" y="574" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#722ed1">数据访问层 Mapper + XML</text><text x="80" y="612" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#303133">MyBatis-Plus BaseMapper + 7 个映射 XML，多表 join、分页、聚合统计都写在这里</text>
<rect x="50" y="680" width="1400" height="120" rx="12" fill="#fff1f0" stroke="#cf1322" stroke-width="2"/><text x="80" y="724" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#cf1322">数据层 MySQL 8 / Redis 5</text><text x="80" y="762" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#303133">zhikao 库 9 张表；Redis 存登录令牌、题库字典、成绩排行</text>
<path d="M 750.0 200 L 750.0 230" stroke="#909399" stroke-width="2" marker-end="url(#a)"/>
<path d="M 750.0 350 L 750.0 380" stroke="#909399" stroke-width="2" marker-end="url(#a)"/>
<path d="M 750.0 500 L 750.0 530" stroke="#909399" stroke-width="2" marker-end="url(#a)"/>
<path d="M 750.0 650 L 750.0 680" stroke="#909399" stroke-width="2" marker-end="url(#a)"/>
</svg>